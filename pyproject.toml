[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "boardchains"
version = "0.1.0"
description = "Exact Markov chain models of Monopoly and Chutes and Ladders, checked against Monte Carlo simulation"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Murad Eyvazov"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
